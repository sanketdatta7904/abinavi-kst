[project]
name = "abinavi-kst"
version = "0.1.0"
description = "Adaptive knowledge-space-theory assessment functions, shaped for upstream contribution to kstpy."
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Abinavi" }]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abinavi_kst"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
